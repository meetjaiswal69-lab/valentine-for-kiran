<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>For Kiran 💖</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    .card {
      background: white;
      padding: 40px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    h1 {
      color: #ff4d6d;
    }

    .buttons {
      position: relative;
      margin-top: 30px;
      height: 120px;
    }

    button {
      padding: 12px 30px;
      font-size: 18px;
      border: none;
      border-radius: 30px;
      cursor: pointer;
    }

    #yesBtn {
      background: #ff4d6d;
      color: white;
    }

    #noBtn {
      background: #ccc;
      position: absolute;
    }
  </style>
</head>
<body>

<div class="card" id="card">
  <h1>Hi Kiran 💖</h1>
  <p>Will you be my Valentine? 🌹</p>

  <div class="buttons">
    <button id="yesBtn" onclick="yesClicked()">YES 💘</button>
    <button id="noBtn" onmouseover="moveNo()">NO 🙅‍♂️</button>
  </div>
</div>

<script>
  function moveNo() {
    const noBtn = document.getElementById("noBtn");
    const x = Math.random() * 200 - 100;
    const y = Math.random() * 100 - 50;
    noBtn.style.transform = `translate(${x}px, ${y}px)`;
  }

  function yesClicked() {
    document.getElementById("card").innerHTML = `
      <h1>Okay deal 💖🥰</h1>
      <p>You just made me the happiest person 😘</p>
    `;
  }
</script>

</body>
</html>
