<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For Kiran 💖</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family: Arial, sans-serif;
  height:100vh;
  overflow:hidden;
  background:#000;
  color:white;
}

.section{
  position:absolute;
  width:100%;
  height:100%;
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  text-align:center;
}

.active{display:flex;}

.card{
  background:rgba(255,255,255,0.95);
  color:#ff4d6d;
  padding:40px;
  border-radius:20px;
  max-width:600px;
}

button{
  padding:12px 30px;
  font-size:18px;
  border:none;
  border-radius:30px;
  cursor:pointer;
  margin:10px;
}

#yes{background:#ff4d6d;color:white;}
#no{background:#ccc;position:absolute;}

.letter{
  max-width:700px;
  font-size:20px;
  line-height:1.6;
  padding:30px;
}

video{
  position:absolute;
  bottom:20px;
  right:20px;
  width:180px;
  border-radius:15px;
  box-shadow:0 10px 25px rgba(0,0,0,0.5);
}

.heart-btn{
  font-size:50px;
  cursor:pointer;
  animation:pulse 1.5s infinite;
  margin-top:20px;
}

@keyframes pulse{
  0%{transform:scale(1);}
  50%{transform:scale(1.2);}
  100%{transform:scale(1);}
}

.gifts button{background:#ff4d6d;color:white;}

.bg{
  background-size:cover;
  background-position:center;
}

.overlay{
  background:rgba(0,0,0,0.6);
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
}

.back{
  background:white;
  color:#ff4d6d;
  margin-top:20px;
}

/* FLOATING HEARTS */
.heart{
  position:fixed;
  bottom:-20px;
  color:#ff4d6d;
  font-size:20px;
  animation:float 6s linear infinite;
  opacity:0.7;
}

@keyframes float{
  0%{transform:translateY(0);opacity:0;}
  50%{opacity:1;}
  100%{transform:translateY(-110vh);opacity:0;}
}
</style>
</head>

<body>

<!-- QUESTION -->
<div class="section active" id="q">
  <div class="card">
    <h1>Hi Kiran 💖</h1>
    <p>Will you be my Valentine?</p>
    <button id="yes" onclick="show('letter')">YES 💘</button>
    <button id="no" onmouseover="moveNo()">NO 🙅‍♂️</button>
  </div>
</div>

<!-- LETTER -->
<div class="section" id="letter">
  <div class="letter" id="text"></div>
  <video src="videos/kiran.mp4" autoplay muted loop></video>
  <div class="heart-btn" onclick="show('gifts')">❤️<br><small>Click me</small></div>
</div>

<!-- GIFTS -->
<div class="section" id="gifts">
  <h1>I planned a few things for us 🎁</h1>
  <div class="gifts">
    <button onclick="openGift('beach')">🌊 Beach</button>
    <button onclick="openGift('cafe')">☕ Cafe</button>
    <button onclick="openGift('mia')">🍗 Mia Kababs</button>
  </div>
</div>

<!-- GIFT VIEW -->
<div class="section bg" id="giftView">
  <div class="overlay">
    <h1 id="giftText"></h1>
    <button class="back" onclick="backFromGift()">← Back</button>
  </div>
</div>

<!-- FINAL LOVE -->
<div class="section" id="final">
  <h1>And after everything…</h1>
  <h2>I just want you to know —</h2>
  <h1 style="margin-top:20px;">I love you, Kiran ❤️</h1>
</div>

<script>
/* LETTER */
const letterText = `Dear Kiran ❤️

Hi babe…
First of all, I want you to know this —
you are the peace of my heart.

I really love you.
Thank you… God ne tujhe mere paas bheja hai,
and I’m so glad to have a girlfriend like you.

Babe, thank you for giving me everything —
your time, your love, your care,
and for always being with me.

Babieeee…
I love youuuuuu 💖`;

let i=0;
function typeLetter(){
  if(i < letterText.length){
    text.innerHTML += letterText.charAt(i);
    i++;
    setTimeout(typeLetter,40);
  }
}

/* NAV */
function show(id){
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  if(id==="letter"){ text.innerHTML=""; i=0; typeLetter(); }
}

/* NO BUTTON */
function moveNo(){
  no.style.transform=`translate(${Math.random()*200-100}px,${Math.random()*100-50}px)`;
}

/* GIFTS */
const photos={
  beach:["images/beach1.jpg","images/beach2.jpg"],
  cafe:["images/cafe1.jpg","images/cafe2.jpg"],
  mia:["images/mia1.jpg","images/mia2.jpg"]
};

let opened={beach:false,cafe:false,mia:false};
let slide;

function openGift(type){
  opened[type]=true;
  show('giftView');

  giftText.innerText =
    type==="beach" ? "Salty air, sunsets & you 🌊" :
    type==="cafe" ? "Coffee, conversations & us ☕" :
    "Because Mia Kababs = happiness 😄🍗";

  let j=0;
  clearInterval(slide);
  giftView.style.backgroundImage=`url(${photos[type][0]})`;

  slide=setInterval(()=>{
    j=(j+1)%photos[type].length;
    giftView.style.backgroundImage=`url(${photos[type][j]})`;
  },3000);
}

function backFromGift(){
  if(opened.beach && opened.cafe && opened.mia){
    show('final');
  } else {
    show('gifts');
  }
}

/* FLOATING HEARTS */
setInterval(()=>{
  const h=document.createElement("div");
  h.className="heart";
  h.innerHTML="❤️";
  h.style.left=Math.random()*100+"vw";
  h.style.fontSize=15+Math.random()*20+"px";
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),6000);
},400);
</script>

</body>
</html>
